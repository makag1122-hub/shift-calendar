name: Android calendar widget

on:
  push:
    branches:
      - main
    paths:
      - "android-widget/**"
      - "app.js"
      - ".github/workflows/android-widget.yml"
    tags:
      - "android-widget-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android-widget/app/shift-calendar.p12

      - name: Resolve signing alias
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          ALIAS="$(keytool -list -v \
            -keystore android-widget/app/shift-calendar.p12 \
            -storetype PKCS12 \
            -storepass "$ANDROID_STORE_PASSWORD" \
            | sed -n 's/^Alias name: //p' \
            | head -n 1)"
          test -n "$ALIAS"
          echo "ANDROID_RESOLVED_ALIAS=$ALIAS" >> "$GITHUB_ENV"

      - name: Build signed APK
        working-directory: android-widget
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/android-widget/app/shift-calendar.p12
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ env.ANDROID_RESOLVED_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Prepare APK
        run: cp android-widget/app/build/outputs/apk/release/app-release.apk shift-calendar-widget.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: shift-calendar-widget
          path: shift-calendar-widget.apk

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/android-widget-v')
        uses: softprops/action-gh-release@v2
        with:
          name: 교대 캘린더 Android 위젯 ${{ github.ref_name }}
          body: |
            월간 교대 달력을 홈 화면에서 확인하는 Android 위젯입니다.

            설치 후 앱을 한 번 열어 근무표를 동기화하고,
            홈 화면을 길게 눌러 `위젯 > 교대 캘린더`를 추가하세요.
          files: shift-calendar-widget.apk
