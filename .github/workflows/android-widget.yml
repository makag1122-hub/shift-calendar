name: Android calendar widget

# 태그 push는 paths 필터와 함께 쓰면 무시되므로, 릴리스 발행은
# workflow_dispatch 입력으로 처리합니다.
on:
  push:
    branches:
      - main
    paths:
      - "android-widget/**"
      - "app.js"
      - "widget-version.json"
      - ".github/workflows/android-widget.yml"
  workflow_dispatch:
    inputs:
      release_version:
        description: "릴리스로 발행할 버전 (예: 1.1.0). 비워두면 빌드만 합니다."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify widget data and version
        run: node tests/verify-android-widget.js

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android-widget/app/shift-calendar.p12

      - name: Resolve signing alias
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          ALIAS="$(keytool -list -v \
            -keystore android-widget/app/shift-calendar.p12 \
            -storetype PKCS12 \
            -storepass "$ANDROID_STORE_PASSWORD" \
            | sed -n 's/^Alias name: //p' \
            | head -n 1)"
          test -n "$ALIAS"
          echo "ANDROID_RESOLVED_ALIAS=$ALIAS" >> "$GITHUB_ENV"

      - name: Build signed direct APK and Play App Bundle
        working-directory: android-widget
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/android-widget/app/shift-calendar.p12
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ env.ANDROID_RESOLVED_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleDirectRelease :app:bundlePlayRelease --stacktrace

      - name: Prepare release files
        run: |
          cp android-widget/app/build/outputs/apk/direct/release/app-direct-release.apk shift-calendar-widget.apk
          cp android-widget/app/build/outputs/bundle/playRelease/app-play-release.aab shift-calendar-play.aab

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: shift-calendar-widget
          path: shift-calendar-widget.apk

      - name: Upload Play Console bundle
        uses: actions/upload-artifact@v4
        with:
          name: shift-calendar-play
          path: shift-calendar-play.aab

      - name: Publish GitHub release
        if: github.event_name == 'workflow_dispatch' && inputs.release_version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-widget-v${{ inputs.release_version }}
          name: 교대 캘린더 Android 위젯 v${{ inputs.release_version }}
          body: |
            월간 교대 달력을 홈 화면에서 확인하는 Android 위젯입니다.

            설치 후 앱을 한 번 열어 근무표를 동기화하고,
            홈 화면을 길게 눌러 `위젯 > 교대 캘린더`를 추가하세요.

            달력 내용(근무 패턴·공휴일·명절 편성)은 앱을 열 때마다 웹에서
            최신으로 갱신되므로, 이 APK는 위젯 화면 자체가 바뀔 때만 새로 받으면 됩니다.
          files: shift-calendar-widget.apk
