plugins {
    id 'com.android.application'
}

def keystorePath = System.getenv('ANDROID_KEYSTORE_FILE')

android {
    namespace 'kr.co.shiftcalendar.widget'
    compileSdk 36

    defaultConfig {
        applicationId 'kr.co.shiftcalendar.widget'
        minSdk 26
        targetSdk 36
        versionCode 23
        versionName '1.22.0'
    }

    flavorDimensions += 'distribution'
    productFlavors {
        direct {
            dimension 'distribution'
            buildConfigField 'boolean', 'SELF_UPDATE_ENABLED', 'true'
        }
        play {
            dimension 'distribution'
            buildConfigField 'boolean', 'SELF_UPDATE_ENABLED', 'false'
        }
    }

    if (keystorePath) {
        signingConfigs {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv('ANDROID_STORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                storeType 'PKCS12'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePath) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    // 카카오톡 초대 공유만 사용합니다. (로그인 SDK는 이름 직접 입력으로 대체되어 제거)
    implementation 'com.kakao.sdk:v2-share:2.24.0'
}
